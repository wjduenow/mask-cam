; mask-cam firmware — nulllab / emakefun ESP32-S3-CAM (silkscreen "SP32S3 CAM V1.1")
;
; Board facts CONFIRMED against the part in hand, 2026-08-20:
;   ESP32-S3 rev v0.2, 8 MB flash, flash type in eFuse = QUAD, 8 MB octal PSRAM,
;   OV3660 sensor, 32 GB SDHC on a 1-bit SD_MMC bus.
;
;   -> memory_type qio_opi.  Do not "simplify" this to qio_qspi: the PSRAM goes
;      silent, the camera falls back to a framebuffer too small for anything
;      above SVGA, and nothing tells you why.
;
; The USB-C on this board goes to the S3's own USB (lsusb: 303a:1001, USB
; JTAG/serial debug unit), not to a bridge chip.  So Serial has to be the
; native peripheral: ARDUINO_USB_MODE=1 + CDC_ON_BOOT=1.  Without those the
; prints go to UART0, which is not wired to anything you can see.
;
; Two environments:
;   mask-cam  the real thing -- stream, record, web UI       (default)
;   selftest  the bring-up checks -- flash this when in doubt

[platformio]
default_envs = mask-cam

[env]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 8MB
board_upload.maximum_size       = 8388608
board_build.partitions          = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

[env:mask-cam]
build_src_filter = +<app/>

; Over the air instead of over USB:
;   pio run -e mask-cam -t upload --upload-port mask-cam.local
; The password comes from OTA_PASSWORD in src/secrets.h; espota wants it on the
; command line, so pass it there rather than committing it here:
;   pio run -e mask-cam -t upload --upload-port mask-cam.local \
;       --upload-flags --auth=YOUR_OTA_PASSWORD
; Leave upload_port as the USB device: it is the right default while the mask
; is open on the bench, and OTA is one flag away.

[env:selftest]
build_src_filter = +<selftest/>

[env:bench]
build_src_filter = +<bench/>
